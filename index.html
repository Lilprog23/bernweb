<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f1117; font-family: 'DM Sans', sans-serif; color: #e8e6e1; }
    .card { width: 400px; padding: 44px 38px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.09); border-radius: 16px; }
    h2 { font-size: 1.6rem; font-weight: 400; margin-bottom: 6px; }
    .sub { font-size: 0.82rem; color: #6a6762; margin-bottom: 32px; }
    .steps { display: flex; gap: 6px; margin-bottom: 32px; }
    .step-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.12); transition: background .3s, width .3s; }
    .step-dot.active { background: #c9a96e; width: 24px; border-radius: 4px; }
    .step-dot.done   { background: rgba(201,169,110,0.35); }
    .panel { display: none; animation: fadeIn .35s ease both; }
    .panel.active { display: block; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    label { display: block; font-size: 0.7rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: #6a6762; margin-bottom: 7px; }
    .input-wrap { position: relative; margin-bottom: 16px; }
    input { width: 100%; padding: 13px 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.09); border-radius: 9px; color: #e8e6e1; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; outline: none; transition: border-color .2s, box-shadow .2s; }
    input:focus { border-color: rgba(255,255,255,0.28); box-shadow: 0 0 0 3px rgba(201,169,110,0.08); }
    input::placeholder { color: #3e3c38; }
    .toggle-pw { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #6a6762; font-size: 0.75rem; }
    .toggle-pw:hover { color: #c9a96e; }
    .btn { width: 100%; padding: 13px; background: linear-gradient(135deg, #7a5e30, #c9a96e); border: none; border-radius: 9px; color: #0f1117; font-family: 'DM Sans', sans-serif; font-size: 0.85rem; font-weight: 500; letter-spacing: 0.07em; text-transform: uppercase; cursor: pointer; transition: opacity .2s, transform .15s; }
    .btn:hover:not(:disabled) { opacity: .88; transform: translateY(-1px); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-outline { width: 100%; padding: 13px; background: none; border: 1px solid rgba(255,255,255,0.12); border-radius: 9px; color: #e8e6e1; font-family: 'DM Sans', sans-serif; font-size: 0.85rem; cursor: pointer; margin-top: 10px; transition: border-color .2s; }
    .btn-outline:hover { border-color: rgba(255,255,255,0.3); }
    .message { margin-top: 14px; padding: 11px 13px; border-radius: 8px; font-size: 0.8rem; line-height: 1.5; display: none; }
    .message.show    { display: block; }
    .message.error   { background: rgba(224,108,117,.1); border: 1px solid rgba(224,108,117,.22); color: #e06c75; }
    .message.success { background: rgba(152,195,121,.1); border: 1px solid rgba(152,195,121,.2);  color: #98c379; }
    .hint { font-size: 0.78rem; color: #6a6762; text-align: center; margin-top: 20px; }
    .hint a { color: #c9a96e; text-decoration: none; cursor: pointer; }
    .hint a:hover { opacity: .75; }
    .success-panel { text-align: center; }
    .success-icon { width: 56px; height: 56px; background: rgba(152,195,121,.12); border: 1px solid rgba(152,195,121,.25); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 1.4rem; }
    .success-panel h2 { margin-bottom: 8px; }
    .success-panel .sub { margin-bottom: 24px; }
    .admin-badge { display: inline-block; background: rgba(201,169,110,0.15); border: 1px solid rgba(201,169,110,0.3); color: #c9a96e; font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; padding: 4px 10px; border-radius: 20px; margin-bottom: 16px; }
    /* Role pill on success */
    .role-pill { display:inline-block; padding: 3px 12px; border-radius: 20px; font-size: 0.72rem; font-weight:500; margin-bottom: 20px; }
    .role-teacher { background: rgba(97,175,239,.12); border: 1px solid rgba(97,175,239,.25); color: #61afef; }
    .role-student { background: rgba(198,120,221,.12); border: 1px solid rgba(198,120,221,.25); color: #c678dd; }
    .role-admin   { background: rgba(201,169,110,.15); border: 1px solid rgba(201,169,110,.3);  color: #c9a96e; }
  </style>
</head>
<body>
<div class="card">

  <!-- Sign In View -->
  <div id="main-view">
    <div class="steps">
      <div class="step-dot active" id="dot-1"></div>
      <div class="step-dot"        id="dot-2"></div>
      <div class="step-dot"        id="dot-3"></div>
    </div>

    <!-- Step 1: Email -->
    <div class="panel active" id="step-1">
      <h2>Hello there 👋</h2>
      <p class="sub">Sign in to your account</p>
      <label for="email">Email address</label>
      <div class="input-wrap">
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email"/>
      </div>
      <button class="btn" onclick="goToStep2()">Continue</button>
      <div class="message" id="msg-1"></div>
      <p class="hint">No account? <a href="register.html">Register here</a></p>
    </div>

    <!-- Step 2: Password -->
    <div class="panel" id="step-2">
      <h2>Welcome back</h2>
      <p class="sub" id="step2-email" style="color:#c9a96e"></p>
      <label for="password">Password</label>
      <div class="input-wrap">
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"/>
        <button class="toggle-pw" onclick="togglePw()" id="pw-toggle">Show</button>
      </div>
      <button class="btn" id="loginBtn" onclick="handleLogin()">Sign In</button>
      <button class="btn-outline" onclick="goBack()">← Back</button>
      <div class="message" id="msg-2"></div>
      <p class="hint"><a onclick="forgotPassword(event)">Forgot password?</a></p>
    </div>
  </div>

  <!-- Success View -->
  <div id="success-view" style="display:none" class="success-panel">
    <div class="success-icon">✓</div>
    <div id="success-badge"></div>
    <h2 id="success-title">You're in!</h2>
    <p class="sub" id="success-email"></p>
    <p id="success-name" style="color:#c9a96e;font-size:.85rem;margin-bottom:20px"></p>
    <button class="btn" id="dashboard-btn" onclick="goToDashboard()">Go to Dashboard →</button>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
  const ADMIN_EMAIL = "admin@gmail.com";

  const firebaseConfig = {
    apiKey: "AIzaSyCUPmQC-9RbzYpuobgNRXYnhFDY1Lvf1JA",
    authDomain: "loginform-a640d.firebaseapp.com",
    projectId: "loginform-a640d",
    storageBucket: "loginform-a640d.firebasestorage.app",
    messagingSenderId: "499206194175",
    appId: "1:499206194175:web:4e844a3fd9519f1c191dca",
    measurementId: "G-BSXS9ZRKCZ"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db   = firebase.firestore();

  let currentUser = null;

  window.addEventListener('beforeunload', () => {
    if (auth.currentUser) db.collection('users').doc(auth.currentUser.uid).update({ online: false });
  });

  // ── Dots ──────────────────────────────────────────────
  function setDots(active) {
    [1,2,3].forEach(i => {
      const d = document.getElementById(`dot-${i}`);
      d.className = 'step-dot' + (i < active ? ' done' : i === active ? ' active' : '');
    });
  }
  function showPanel(n) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById(`step-${n}`).classList.add('active');
    setDots(n);
  }

  // ── Helpers ───────────────────────────────────────────
  function showMsg(id, text, type) { const el = document.getElementById(id); el.textContent = text; el.className = `message ${type} show`; }
  function hideMsg(id) { document.getElementById(id).className = 'message'; }
  function togglePw() {
    const input = document.getElementById('password');
    const btn   = document.getElementById('pw-toggle');
    const hidden = input.type === 'password';
    input.type = hidden ? 'text' : 'password';
    btn.textContent = hidden ? 'Hide' : 'Show';
  }

  // ── Step 1 → 2 ────────────────────────────────────────
  function goToStep2() {
    hideMsg('msg-1');
    const email = document.getElementById('email').value.trim();
    if (!email || !email.includes('@')) { showMsg('msg-1', 'Please enter a valid email.', 'error'); return; }
    document.getElementById('step2-email').textContent = email;
    showPanel(2);
    document.getElementById('password').focus();
  }
  function goBack() { hideMsg('msg-2'); showPanel(1); }

  // ── Login ─────────────────────────────────────────────
  async function handleLogin() {
    hideMsg('msg-2');
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    if (!password) { showMsg('msg-2', 'Please enter your password.', 'error'); return; }

    const btn = document.getElementById('loginBtn');
    btn.disabled = true; btn.textContent = 'Signing in…';

    try {
      const cred = await auth.signInWithEmailAndPassword(email, password);

      // Mark online
      await db.collection('users').doc(cred.user.uid).set({
        online: true, lastSeen: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });

      // Get profile from Firestore
      const doc  = await db.collection('users').doc(cred.user.uid).get();
      const data = doc.exists ? doc.data() : {};
      currentUser = { ...cred.user, ...data };

      const isAdmin   = cred.user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase();
      const role      = isAdmin ? 'admin' : (data.role || 'user');
      const fullName  = [data.firstName, data.lastName].filter(Boolean).join(' ');

      showSuccess(cred.user.email, role, fullName);
    } catch (err) {
      const msgs = {
        'auth/wrong-password':     'Incorrect password.',
        'auth/user-not-found':     'No account found.',
        'auth/invalid-credential': 'Invalid email or password.',
        'auth/too-many-requests':  'Too many attempts — try again later.',
      };
      showMsg('msg-2', msgs[err.code] || err.message, 'error');
    } finally { btn.disabled = false; btn.textContent = 'Sign In'; }
  }

  // ── Forgot ────────────────────────────────────────────
  async function forgotPassword(e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    if (!email) { showMsg('msg-2', 'Enter your email on step 1 first.', 'error'); return; }
    try { await auth.sendPasswordResetEmail(email); showMsg('msg-2', 'Reset link sent — check your inbox.', 'success'); }
    catch(err) { showMsg('msg-2', err.message, 'error'); }
  }

  // ── Success ───────────────────────────────────────────
  function showSuccess(email, role, fullName) {
    document.getElementById('main-view').style.display    = 'none';
    document.getElementById('success-view').style.display = 'block';

    const titles  = { admin: 'Welcome, Admin! 👑', teacher: 'Welcome, Teacher! 📚', student: 'Welcome back! 🎓' };
    const badges  = {
      admin:   '<div class="admin-badge">⚙ Administrator</div>',
      teacher: '<span class="role-pill role-teacher">📚 Teacher</span>',
      student: '<span class="role-pill role-student">🎓 Student</span>',
    };
    const btnText = { admin: 'Go to Admin Dashboard →', teacher: 'Go to Dashboard →', student: 'Go to Dashboard →' };

    document.getElementById('success-title').textContent = titles[role]  || "You're in!";
    document.getElementById('success-badge').innerHTML   = badges[role]  || '';
    document.getElementById('dashboard-btn').textContent = btnText[role] || 'Go to Dashboard →';
    document.getElementById('success-email').textContent = email;
    document.getElementById('success-name').textContent  = fullName;

    // Store role for redirect
    document.getElementById('dashboard-btn').dataset.role = role;
  }

  function goToDashboard() {
    const role = document.getElementById('dashboard-btn').dataset.role;
    if (role === 'admin')   window.location.href = 'admin-dashboard.html';
    else                    window.location.href = 'dashboard.html';
  }

  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    if (document.getElementById('step-1').classList.contains('active')) goToStep2();
    if (document.getElementById('step-2').classList.contains('active')) handleLogin();
  });
</script>
</body>
</html>
