<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; background: #0f1117; font-family: 'DM Sans', sans-serif; color: #e8e6e1; }

    .sidebar {
      position: fixed; top: 0; left: 0;
      width: 220px; height: 100vh;
      background: rgba(255,255,255,0.03);
      border-right: 1px solid rgba(255,255,255,0.07);
      padding: 28px 16px;
      display: flex; flex-direction: column;
    }
    .logo { display: flex; align-items: center; gap: 10px; padding: 0 8px; margin-bottom: 32px; }
    .logo-icon { width: 34px; height: 34px; background: linear-gradient(135deg, #7a5e30, #c9a96e); border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 1rem; }
    .logo-text  { font-size: 0.9rem; font-weight: 500; }
    .logo-badge { font-size: 0.65rem; color: #c9a96e; letter-spacing: 0.1em; text-transform: uppercase; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; font-size: 0.85rem; color: #6a6762; cursor: pointer; transition: background .2s, color .2s; margin-bottom: 2px; border: none; background: none; width: 100%; text-align: left; }
    .nav-item:hover  { background: rgba(255,255,255,0.04); color: #e8e6e1; }
    .nav-item.active { background: rgba(201,169,110,0.1); color: #c9a96e; }
    .sidebar-bottom { margin-top: auto; }
    .admin-info { padding: 12px; background: rgba(201,169,110,0.07); border: 1px solid rgba(201,169,110,0.15); border-radius: 10px; margin-bottom: 10px; }
    .admin-info .label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em; color: #c9a96e; margin-bottom: 4px; }
    .admin-info .email { font-size: 0.78rem; color: #e8e6e1; word-break: break-all; }

    .main { margin-left: 220px; padding: 36px 32px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; }
    .topbar h1 { font-size: 1.4rem; font-weight: 400; }
    .logout-btn { padding: 8px 16px; background: none; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #6a6762; font-family: 'DM Sans', sans-serif; font-size: 0.8rem; cursor: pointer; transition: border-color .2s, color .2s; }
    .logout-btn:hover { border-color: #e06c75; color: #e06c75; }

    /* Stats */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 32px; }
    .stat-card { padding: 22px 20px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); border-radius: 12px; }
    .stat-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; color: #6a6762; margin-bottom: 10px; }
    .stat-value { font-size: 2rem; font-weight: 300; }
    .stat-sub   { font-size: 0.75rem; color: #6a6762; margin-top: 4px; }
    .stat-up    { color: #98c379; }

    /* Table */
    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px;
    }
    .section-title { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; color: #6a6762; }
    .live-dot {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.72rem; color: #98c379;
    }
    .live-dot::before {
      content: '';
      width: 7px; height: 7px;
      background: #98c379;
      border-radius: 50%;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; transform: scale(1); }
      50%      { opacity: .4; transform: scale(1.3); }
    }

    .table-wrap { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); border-radius: 12px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th { padding: 12px 16px; text-align: left; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.1em; color: #6a6762; border-bottom: 1px solid rgba(255,255,255,0.06); }
    td { padding: 13px 16px; font-size: 0.83rem; border-bottom: 1px solid rgba(255,255,255,0.04); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.02); }

    .badge { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 0.7rem; font-weight: 500; }
    .badge-user   { background: rgba(255,255,255,0.06); color: #9a9690; border: 1px solid rgba(255,255,255,0.1); }

    /* Online / Offline status */
    .status {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 3px 10px; border-radius: 20px;
      font-size: 0.72rem; font-weight: 500;
    }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .status.online  { background: rgba(152,195,121,.12); color: #98c379; border: 1px solid rgba(152,195,121,.2); }
    .status.online  .status-dot { background: #98c379; animation: pulse 1.5s ease-in-out infinite; }
    .status.offline { background: rgba(255,255,255,.04); color: #6a6762; border: 1px solid rgba(255,255,255,.08); }
    .status.offline .status-dot { background: #6a6762; }

    .empty-row td { text-align: center; color: #6a6762; padding: 28px; font-size: 0.85rem; }
  </style>
</head>
<body>

<div class="sidebar">
  <div class="logo">
    <div class="logo-icon">⚙</div>
    <div>
      <div class="logo-text">Control Panel</div>
      <div class="logo-badge">Administrator</div>
    </div>
  </div>

  <button class="nav-item active"><span>📊</span> Dashboard</button>
  <button class="nav-item"><span>👥</span> Users</button>
  <button class="nav-item"><span>📋</span> Reports</button>
  <button class="nav-item"><span>⚙️</span> Settings</button>

  <div class="sidebar-bottom">
    <div class="admin-info">
      <div class="label">Logged in as</div>
      <div class="email" id="sidebar-email">loading…</div>
    </div>
    <button class="nav-item" onclick="handleLogout()"><span>🚪</span> Sign Out</button>
  </div>
</div>

<div class="main">
  <div class="topbar">
    <h1>Dashboard Overview</h1>
    <button class="logout-btn" onclick="handleLogout()">Sign Out</button>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat-card">
      <div class="stat-label">Total Users</div>
      <div class="stat-value" id="stat-total">—</div>
      <div class="stat-sub">registered accounts</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Online Now</div>
      <div class="stat-value stat-up" id="stat-online">—</div>
      <div class="stat-sub stat-up">currently active</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Offline</div>
      <div class="stat-value" id="stat-offline">—</div>
      <div class="stat-sub">not active</div>
    </div>
  </div>

  <!-- Users table -->
  <div class="section-header">
    <div class="section-title">All Users</div>
    <div class="live-dot">Live</div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Email</th>
          <th>Role</th>
          <th>Status</th>
          <th>Last Seen</th>
        </tr>
      </thead>
      <tbody id="users-table">
        <tr class="empty-row"><td colspan="5">Loading users…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
  const ADMIN_EMAIL = "admin@gmail.com"; // 👈 keep same as index.html

  const firebaseConfig = {
    apiKey: "AIzaSyCUPmQC-9RbzYpuobgNRXYnhFDY1Lvf1JA",
    authDomain: "loginform-a640d.firebaseapp.com",
    projectId: "loginform-a640d",
    storageBucket: "loginform-a640d.firebasestorage.app",
    messagingSenderId: "499206194175",
    appId: "1:499206194175:web:4e844a3fd9519f1c191dca",
    measurementId: "G-BSXS9ZRKCZ"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db   = firebase.firestore();

  // ── Guard: must be logged in as admin ────────────────
  auth.onAuthStateChanged(user => {
    if (!user) {
      window.location.href = 'index.html';
      return;
    }
    if (user.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
      // Not admin — send to regular dashboard
      window.location.href = 'dashboard.html';
      return;
    }
    document.getElementById('sidebar-email').textContent = user.email;
    listenToUsers(); // start realtime listener
  });

  // ── Realtime listener ─────────────────────────────────
  function listenToUsers() {
    db.collection('users').onSnapshot(snapshot => {
      const users = [];
      snapshot.forEach(doc => {
        const data = doc.data();
        // Exclude admin from the list
        if (data.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
          users.push({ id: doc.id, ...data });
        }
      });

      renderUsers(users);
      updateStats(snapshot, users);
    });
  }

  function renderUsers(users) {
    const tbody = document.getElementById('users-table');

    if (users.length === 0) {
      tbody.innerHTML = `<tr class="empty-row"><td colspan="5">No users registered yet.</td></tr>`;
      return;
    }

    tbody.innerHTML = users.map((u, i) => {
      const isOnline  = u.online === true;
      const lastSeen  = formatTime(u.lastSeen);

      return `
        <tr>
          <td style="color:#6a6762">${i + 1}</td>
          <td>${u.email}</td>
          <td><span class="badge badge-user">User</span></td>
          <td>
            <span class="status ${isOnline ? 'online' : 'offline'}">
              <span class="status-dot"></span>
              ${isOnline ? 'Online' : 'Offline'}
            </span>
          </td>
          <td style="color:#6a6762">${lastSeen}</td>
        </tr>
      `;
    }).join('');
  }

  function updateStats(snapshot, nonAdminUsers) {
    const total   = nonAdminUsers.length;
    const online  = nonAdminUsers.filter(u => u.online === true).length;
    const offline = total - online;

    document.getElementById('stat-total').textContent   = total;
    document.getElementById('stat-online').textContent  = online;
    document.getElementById('stat-offline').textContent = offline;
  }

  function formatTime(ts) {
    if (!ts) return '—';
    const date = ts.toDate ? ts.toDate() : new Date(ts);
    const now  = new Date();
    const diff = Math.floor((now - date) / 1000); // seconds

    if (diff < 10)   return 'Just now';
    if (diff < 60)   return `${diff}s ago`;
    if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
    if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
    return date.toLocaleDateString();
  }

  function handleLogout() {
    const user = auth.currentUser;
    if (user) {
      db.collection('users').doc(user.uid).update({ online: false }).then(() => {
        auth.signOut().then(() => window.location.href = 'index.html');
      });
    }
  }
</script>
</body>
</html>
